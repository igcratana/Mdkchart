<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger P2P Chat - Stable Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Khmer+OS+Siemreap&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Khmer OS Siemreap', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <!-- ជំហានទី ១៖ Login -->
    <div id="login-modal" class="bg-white p-8 rounded-2xl shadow-xl w-96 text-center">
        <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-3xl font-bold">💬</div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Messenger P2P</h2>
        <p class="text-gray-500 text-sm mb-6">បញ្ចូលឈ្មោះរបស់អ្នកដើម្បីចាប់ផ្តើម</p>
        <input type="text" id="username-input" placeholder="ឈ្មោះរបស់អ្នក (ឧ. Dara)" 
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 text-center text-lg">
        <button onclick="login()" 
            class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition">
            ចូលប្រព័ន្ធ
        </button>
        <p id="login-status" class="text-xs text-red-500 mt-3"></p>
    </div>

    <!-- ជំហានទី ២៖ Chat Interface -->
    <div id="chat-container" class="hidden w-full max-w-4xl h-[90vh] bg-white rounded-2xl shadow-2xl flex overflow-hidden border border-gray-200">
        
        <!-- Sidebar -->
        <div class="w-1/3 bg-gray-50 border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-white">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold" id="my-avatar">U</div>
                    <div>
                        <h3 class="font-bold text-gray-800" id="display-my-name"></h3>
                        <p class="text-xs text-green-600">● Online</p>
                    </div>
                </div>
            </div>

            <!-- Connect Box -->
            <div class="p-4 border-b border-gray-200 bg-white">
                <label class="block text-xs font-semibold text-gray-600 mb-1">តភ្ជាប់ទៅកាន់មិត្តភក្តិ៖</label>
                <div class="flex gap-2">
                    <input type="text" id="target-username" placeholder="ឈ្មោះមិត្តភក្តិ..." 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="connectToPeer()" 
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 transition">
                        តភ្ជាប់
                    </button>
                </div>
                <p id="connection-status" class="text-xs text-gray-500 mt-2">ស្ថានភាព៖ មិនទាន់តភ្ជាប់</p>
            </div>

            <div class="flex-1 p-4 overflow-y-auto text-gray-400 text-sm text-center flex flex-col justify-center items-center">
                <p>បញ្ចូលឈ្មោះមិត្តភក្តិ រួចចុចតភ្ជាប់ដើម្បីចាប់ផ្តើមឆាត!</p>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="w-2/3 flex flex-col bg-white">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-white">
                <h4 class="font-bold text-gray-800" id="chat-with-name">មិនទាន់មានការជ្រើសរើស</h4>
            </div>

            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col space-y-3 bg-slate-50">
                <div class="text-center text-gray-400 text-sm my-auto">សូមបង្កើតការតភ្ជាប់ជាមុនសិន 👋</div>
            </div>

            <div class="p-4 border-t border-gray-200 bg-white flex items-center gap-2">
                <input type="file" id="image-file-input" accept="image/*" class="hidden" onchange="sendImage(event)">
                <button onclick="document.getElementById('image-file-input').click()" 
                    class="p-2.5 text-blue-600 hover:bg-blue-50 rounded-full transition">📷</button>
                <input type="text" id="message-input" placeholder="វាយសាររបស់អ្នកទីនេះ..." onkeypress="handleKeyPress(event)"
                    class="flex-1 px-4 py-2.5 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <button onclick="sendMessage()" 
                    class="bg-blue-600 text-white px-5 py-2.5 rounded-full text-sm font-semibold hover:bg-blue-700 transition">ផ្ញើ</button>
            </div>
        </div>
    </div>

    <script>
        let peer;
        let conn;
        let myUsername = "";
        let targetUsername = "";
        const APP_PREFIX = "kh_messenger_v2_";

        function login() {
            const inputVal = document.getElementById('username-input').value.trim();
            if (!inputVal) {
                document.getElementById('login-status').innerText = "សូមបញ្ចូលឈ្មោះរបស់អ្នក!";
                return;
            }

            myUsername = inputVal;
            const myPeerId = APP_PREFIX + myUsername;

            document.getElementById('login-status').innerText = "កំពុងភ្ជាប់ទៅកាន់ Server...";

            // បង្កើត Peer Object (ប្រើប្រាស់ Public Cloud Server របស់ PeerJS)
            peer = new Peer(myPeerId);

            peer.on('open', (id) => {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('chat-container').classList.remove('hidden');
                document.getElementById('display-my-name').innerText = myUsername;
                document.getElementById('my-avatar').innerText = myUsername.charAt(0).toUpperCase();
            });

            peer.on('error', (err) => {
                console.error(err);
                if (err.type === 'unavailable-id') {
                    document.getElementById('login-status').innerText = "ឈ្មោះនេះមានគេប្រើរួចហើយ!";
                } else {
                    document.getElementById('login-status').innerText = "កំហុសបណ្តាញ: " + err.type;
                }
            });

            // ទទួលការតភ្ជាប់ចូលពីមិត្តភក្តិ
            peer.on('connection', (incomingConn) => {
                if (conn && conn.open) {
                    incomingConn.close(); // បដិសេធបើកំពុងឆាតជាមួយអ្នកផ្សេងស្រាប់
                    return;
                }
                conn = incomingConn;
                targetUsername = conn.peer.replace(APP_PREFIX, '');
                setupConnection();
            });
        }

        function connectToPeer() {
            const inputTarget = document.getElementById('target-username').value.trim();
            if (!inputTarget) {
                alert('សូមបញ្ចូលឈ្មោះមិត្តភក្តិ!');
                return;
            }
            if (inputTarget === myUsername) {
                alert('មិនអាចឆាតរកខ្លួនឯងបានទេ!');
                return;
            }

            targetUsername = inputTarget;
            const targetPeerId = APP_PREFIX + targetUsername;

            document.getElementById('connection-status').innerText = "កំពុងព្យាយាមតភ្ជាប់ទៅ " + targetUsername + "...";

            // បើកការតភ្ជាប់ទៅកាន់ Peer ម្ខាងទៀត
            conn = peer.connect(targetPeerId, { reliable: true });
            setupConnection();
        }

        function setupConnection() {
            if (!conn) return;

            conn.on('open', () => {
                document.getElementById('connection-status').innerText = "បានតភ្ជាប់ជាមួយ: " + targetUsername;
                document.getElementById('connection-status').className = "text-xs text-green-600 mt-2 font-semibold";
                document.getElementById('chat-with-name').innerText = targetUsername;
                
                document.getElementById('chat-messages').innerHTML = `
                    <div class="text-center text-gray-400 text-xs my-2">ការតភ្ជាប់បានជោគជ័យជាមួយ ${targetUsername} 🔒</div>
                `;
            });

            conn.on('data', (data) => {
                if (data.type === 'text') {
                    appendMessage(data.content, 'received');
                } else if (data.type === 'image') {
                    appendImage(data.content, 'received');
                }
            });

            conn.on('close', () => {
                alert('ការតភ្ជាប់ត្រូវបានផ្ដាច់!');
                resetConnectionUI();
            });

            conn.on('error', (err) => {
                alert('មានបញ្ហាក្នុងការតភ្ជាប់៖ ' + err);
                resetConnectionUI();
            });
        }

        function resetConnectionUI() {
            conn = null;
            document.getElementById('connection-status').innerText = "ស្ថានភាព៖ មិនទាន់តភ្ជាប់";
            document.getElementById('connection-status').className = "text-xs text-gray-500 mt-2";
            document.getElementById('chat-with-name').innerText = "មិនទាន់មានការជ្រើសរើស";
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            if (!conn || !conn.open) {
                alert('សូមតភ្ជាប់ទៅកាន់មិត្តភក្តិជាមុនសិន!');
                return;
            }

            conn.send({ type: 'text', content: text });
            appendMessage(text, 'sent');
            input.value = '';
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!conn || !conn.open) {
                alert('សូមតភ្ជាប់ទៅកាន់មិត្តភក្តិជាមុនសិន!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Img = e.target.result;
                conn.send({ type: 'image', content: base64Img });
                appendImage(base64Img, 'sent');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function appendMessage(text, type) {
            const chatBox = document.getElementById('chat-messages');
            const isSent = type === 'sent';
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isSent ? 'items-end' : 'items-start'}`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-[70%] px-4 py-2.5 rounded-2xl text-sm shadow-sm ${
                isSent ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-200 text-gray-800 rounded-bl-none'
            }`;
            bubble.innerText = text;

            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendImage(imgSrc, type) {
            const chatBox = document.getElementById('chat-messages');
            const isSent = type === 'sent';
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isSent ? 'items-end' : 'items-start'}`;

            const img = document.createElement('img');
            img.src = imgSrc;
            img.className = 'max-w-[220px] rounded-2xl shadow-md border border-gray-200';

            wrapper.appendChild(img);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
